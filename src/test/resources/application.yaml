server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/flat_rent?currentSchema=test
    username: postgres
    password: 123456
    driver: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: DEBUG
    org:
      hibernate:
        orm:
          jdbc:
            bind: DEBUG
    com:
      javaacademy:
        flat_rent: DEBUG
